<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Schedi Samet">
  <title>Schedi Samet</title>
  <!--
    Ein S aus drei waagerechten Balken und zwei Bögen, mit flachen Endbalken
    und schräg geschnittenen Enden.

    Die Aufteilung ist an der Vorlage ausgemessen: oberer Balken 5,75 bis 17,25,
    Freiraum bis 26,25, Mittelbalken bis 37,75, Freiraum bis 46,75, unterer
    Balken bis 58,25. Der Mittelteil liegt waagerecht, nicht diagonal. Eine
    flache Diagonale quetscht die beiden Freiräume zu Schlitzen zusammen, weil
    sich dann die Ränder des Strichs überlagern.

    Gezeichnet als Strich gleichmäßiger Stärke über einer Mittellinie. Sie ist
    punktsymmetrisch zur Mitte (32, 32): die untere Hälfte ist die gedrehte
    obere, jeder Kontrollpunkt hat sein Gegenstück. An den Bogenaußenseiten
    steht die Tangente senkrecht, an den Balken waagerecht, deshalb sitzen die
    Übergänge ohne Knick.

    Die beiden Endbalken laufen absichtlich über den Bildrand hinaus, bis x=70
    und x=-6. Abgeschnitten werden sie vom Beschnittpfad, einem Quadrat mit zwei
    herausgenommenen Dreiecken. Nur so entsteht der schräge Schnitt: ein
    stumpfer Abschluss stünde senkrecht zur Laufrichtung und damit senkrecht.

    Die Berührung der Seitenkanten steckt in den Ecken dieser Dreiecke. Oben
    rechts liegt die obere Schnittecke auf x=64, unten links die untere auf x=0.
    Die Dreiecke reichen 1,25 über den Balken hinaus, sonst bliebe an der
    Schnittkante ein Haarstrich stehen. Wer die Strichstärke ändert, muss die
    Dreiecke mitziehen, sonst berührt das Zeichen die Kanten nicht mehr oder
    läuft darüber hinaus.

    Die Farbe steht doppelt: als Attribut für Werkzeuge, die den Stilblock
    ignorieren, und im Stilblock für dunkle Oberflächen. Beide Werte sind
    dieselben wie --color-fg auf der Seite, hell und dunkel.
  -->
  <style>
    .mark { stroke: #0a0a0a; }

    @media (prefers-color-scheme: dark) {
      .mark { stroke: #f4f4f5; }
    }
  </style>

  <defs>
    <clipPath id="ends">
      <polygon
        points="0,0 64,0 64,5.75 58,17.25 64,18.5 64,64 0,64 0,58.25 6,46.75 0,45.5"
      />
    </clipPath>
  </defs>

  <path
    class="mark"
    d="M70 11.5L26 11.5C19.55 11.5 15.65 15.3 15.65 21.75C15.65 28.2 19.55 32 26 32L38 32C44.45 32 48.35 35.8 48.35 42.25C48.35 48.7 44.45 52.5 38 52.5L-6 52.5"
    fill="none"
    stroke="#0a0a0a"
    stroke-width="11.5"
    stroke-linecap="butt"
    stroke-linejoin="round"
    clip-path="url(#ends)"
  />
</svg>
